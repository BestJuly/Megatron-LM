DEPENDENCIES:
  pytorch_base_image: nvcr.io/nvidia/pytorch:26.07-py3
  dockerfile_path: examples/moe_recipes/qwen3_5_397b/Dockerfile
  benchmark_megatron_commit: 2e8af47307c03cc86af1cfa0a55ae3163aecf616
  hardware:
    gpu: GB300
    cpu_arch: aarch64
    num_gpus: 256
    num_nodes: 64
    gpus_per_node: 4
ENTRY:
  script: pretrain_gpt.py
ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  FLA_DISABLE_TENSOR_CACHE: '1'
  HF_HUB_OFFLINE: '1'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_NVLS_ENABLE: '0'
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
  NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_DISPATCH_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_PREPROCESSING_API: '128'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  PYTHONWARNINGS: ignore
ARGS:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: Qwen/Qwen3.8-2.4T-A95B
  num_layers: 92
  hidden_size: 8192
  num_attention_heads: 64
  kv_channels: 256
  max_position_embeddings: 262144
  group_query_attention: true
  num_query_groups: 4
  qk_layernorm: true
  attention_output_gate: true
  normalization: RMSNorm
  apply_layernorm_1p: true
  norm_epsilon: 1e-6
  swiglu: true
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  position_embedding_type: rope
  rotary_percent: 0.25
  rotary_base: 10000000
  make_vocab_size_divisible_by: 1940
  experimental_attention_variant: gated_delta_net
  linear_attention_freq: 4
  linear_conv_kernel_dim: 4
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_num_key_heads: 16
  linear_num_value_heads: 128
  num_experts: 512
  moe_ffn_hidden_size: 2048
  moe_shared_expert_intermediate_size: 2048
  moe_shared_expert_gate: true
  moe_router_load_balancing_type: aux_loss
  moe_router_topk: 10
  moe_router_pre_softmax: false
  moe_aux_loss_coeff: 1e-3
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.1
  mtp_use_repeated_layer: false
  attention_dropout: 0.0
  hidden_dropout: 0.0
  no_weight_decay_cond_type: apply_wd_to_qk_layernorm
  mock_data: true
  seq_length: 65536
  moe_router_force_load_balancing: true
  distributed_timeout_minutes: 60
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 4
  expert_model_parallel_size: 64
  context_parallel_size: 16
  expert_tensor_parallel_size: 1
  pipeline_model_parallel_layout: Et*21|t*25|t*25|t*21,m,L
  cuda_graph_impl: transformer_engine
  cuda_graph_modules:
  - attn
  use_distributed_optimizer: true
  sequence_parallel: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_flex_dispatcher_num_sms: 32
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_router_fusion: true
  moe_router_dtype: fp32
  moe_megakernel_backend: mok
  moe_megakernel_backend_config: '{"fwd_num_comm_sms": 64, "bwd_num_comm_sms": 64, "minibatch_size": 8192, "macrobatch_size": 65536, "schedule_capacity_multiplier": 0.0625, "all_gather_top_experts_chunk_bytes": 2048}'
  gdn_gdr_backend: cudnn
  gdn_pre_gated_delta_rule_fusion: true
  recompute_granularity: selective
  recompute_modules:
  - moe_act
  - gdn
  offload_optimizer_states: true
  use_mcore_models: true
  transformer_impl: transformer_engine
  micro_batch_size: 1
  global_batch_size: 256
  linear_cp_mode: headwise
  train_iters: 50
  exit_duration_in_mins: 45
  no_save_optim: true
  no_check_for_nan_in_loss_and_grad: true
  no_create_attention_mask_in_dataloader: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: te
  use_varlen_dataset: true
  varlen_mock_dataset_config_json: '{"mode":"distribution","type":"lognormal","format":"thd","min_seq_len":65536,"max_seq_len":65536,"mean_seq_len":65536,"lognormal_sigma":1.1}'
  sequence_packing_scheduler: dp_balanced
  pad_packed_seq_alignment: max
  max_seqlen_per_dp_cp_rank: 4096
  thd_max_packed_sequences: 8
  thd_tail_padding_policy: append_dummy_seq
  calculate_per_token_loss: true
  manual_gc: true
  manual_gc_interval: 10
  num_workers: 0
  num_dataset_builder_threads: 1
  lr: 3.9e-06
  min_lr: 3.9e-07
  lr_warmup_init: 3.9e-07
  lr_decay_style: cosine
  lr_decay_iters: 50
  lr_warmup_iters: 0
  weight_decay: 0.1
  clip_grad: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  bf16: true
  fp8_format: e4m3
  fp8_recipe: mxfp8
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  use_precision_aware_optimizer: true
  main_grads_dtype: bf16
  main_params_dtype: fp32
  exp_avg_dtype: bf16
  exp_avg_sq_dtype: bf16
  moe_router_padding_for_quantization: true
  init_method_std: 0.02
  seed: 1234
  eval_iters: 1
  eval_interval: 1000
  log_throughput: true
  log_interval: 1
  log_memory_interval: 1
  log_device_memory_used: true
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  logging_level: 20
  tensorboard_dir: ${OUTPUT_PATH}/tensorboard
  wandb_exp_name: Qwen3.8-2.4T-A95B-GB300-MXFP8-THD64K-TP1PP4EP64CP16-MoK
  enable_experimental: true

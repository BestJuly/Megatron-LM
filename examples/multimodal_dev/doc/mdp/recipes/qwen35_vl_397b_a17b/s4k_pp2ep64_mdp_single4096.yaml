# Complete enabled arguments from archived job 717519; no external BASE/model YAML required.
# See benchmarks/rebench_environment.md for the pinned image and launch requirements.
# Replace <CONTAINER_SQSH>; set MCORE_ROOT and MCORE_BENCH_OUTPUT when using a toolkit.
# The adjacent .sh expands those paths without requiring mcore-devtoolkit.
# MEGATRON.commit is the measured source snapshot, not a request to rewrite this branch.
MEGATRON:
  repo: https://github.com/BestJuly/Megatron-LM.git
  branch: qizhang/mdp-qwen35vl-35b/397b-benchmark
  commit: 6a975c1aab457ae88b16247582674c3dc81a1300
ENTRY:
  script: examples/multimodal_dev/pretrain_multimodal.py
CONTAINER:
  image: <CONTAINER_SQSH>
  prelaunch_command: export LD_LIBRARY_PATH=/usr/local/lib/python3.12/dist-packages/nvidia/cudnn/lib:\${LD_LIBRARY_PATH:-}
ENV_VARS:
  CUDA_DEVICE_MAX_CONNECTIONS: '8'
  CUDNN_HOME: /usr/local/lib/python3.12/dist-packages/nvidia/cudnn
  FLA_DISABLE_TENSOR_CACHE: '1'
  HF_HUB_OFFLINE: '1'
  MDP_ALLOW_OVERLAP_WITH_CUDA_GRAPHS: '1'
  NCCL_GRAPH_REGISTER: '0'
  NCCL_NVLS_ENABLE: '0'
  NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_DISPATCH_API: '128'
  NUM_OF_TOKENS_PER_CHUNK_PREPROCESSING_API: '128'
  NVTE_ALLOW_NONDETERMINISTIC_ALGO: '1'
  NVTE_FUSED_ATTN: '1'
  NVTE_NORM_BWD_USE_CUDNN: '1'
  NVTE_NORM_FWD_USE_CUDNN: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
ARGS:
  tokenizer_type: HuggingFaceTokenizer
  tokenizer_model: Qwen/Qwen3.5-397B-A17B
  num_layers: '60'
  hidden_size: '4096'
  num_attention_heads: '32'
  kv_channels: '256'
  max_position_embeddings: '262144'
  group_query_attention: true
  num_query_groups: '2'
  qk_layernorm: true
  attention_output_gate: true
  normalization: RMSNorm
  apply_layernorm_1p: true
  norm_epsilon: 1e-6
  swiglu: true
  disable_bias_linear: true
  untie_embeddings_and_output_weights: true
  position_embedding_type: rope
  rotary_percent: '0.25'
  rotary_base: '10000000'
  make_vocab_size_divisible_by: '1940'
  experimental_attention_variant: gated_delta_net
  linear_attention_freq: '4'
  linear_conv_kernel_dim: '4'
  linear_key_head_dim: '128'
  linear_value_head_dim: '128'
  linear_num_key_heads: '16'
  linear_num_value_heads: '64'
  num_experts: '512'
  moe_ffn_hidden_size: '1024'
  moe_shared_expert_intermediate_size: '1024'
  moe_shared_expert_gate: true
  moe_router_load_balancing_type: aux_loss
  moe_router_topk: '10'
  moe_aux_loss_coeff: 1e-3
  mtp_num_layers: '1'
  mtp_loss_scaling_factor: '0.1'
  attention_dropout: '0.0'
  hidden_dropout: '0.0'
  no_weight_decay_cond_type: apply_wd_to_qk_layernorm
  dataset_provider: mdp_mock
  use_vanilla_collate_fn: true
  use_packed_sequence: true
  moe_router_force_load_balancing: true
  tensor_model_parallel_size: '1'
  pipeline_model_parallel_size: '2'
  expert_model_parallel_size: '64'
  pipeline_model_parallel_layout: Et*16|t*16|t*16|t*12,m,L
  context_parallel_size: '1'
  expert_tensor_parallel_size: '1'
  use_distributed_optimizer: true
  overlap_grad_reduce: true
  overlap_param_gather: true
  moe_token_dispatcher_type: flex
  moe_flex_dispatcher_backend: hybridep
  moe_flex_dispatcher_num_sms: '32'
  moe_grouped_gemm: true
  moe_permute_fusion: true
  moe_router_fusion: true
  moe_router_dtype: fp32
  cuda_graph_impl: transformer_engine
  cuda_graph_modules:
  - attn
  - moe_router
  - moe_preprocess
  te_rng_tracker: true
  cuda_graph_warmup_steps: '2'
  use_mcore_models: true
  use_flash_attn: true
  transformer_impl: transformer_engine
  gdn_pre_gated_delta_rule_fusion: true
  gdn_kernel_backend: cudnn
  micro_batch_size: '1'
  global_batch_size: '2048'
  seq_length: '4096'
  train_samples: '585937500'
  exit_duration_in_mins: '25'
  exit_interval: '20'
  no_save_optim: true
  no_check_for_nan_in_loss_and_grad: true
  cross_entropy_loss_fusion: true
  cross_entropy_fusion_impl: te
  no_create_attention_mask_in_dataloader: true
  manual_gc: true
  manual_gc_interval: '5'
  rerun_mode: disabled
  num_workers: '6'
  calculate_per_token_loss: true
  pad_packed_seq_alignment: max
  max_seqlen_per_dp_cp_rank: '4096'
  thd_max_packed_sequences: '8'
  thd_tail_padding_policy: append_dummy_seq
  use_precision_aware_optimizer: true
  main_grads_dtype: fp32
  main_params_dtype: fp32
  exp_avg_dtype: bf16
  exp_avg_sq_dtype: bf16
  lr: '0.00012'
  min_lr: '1.2e-05'
  lr_decay_style: cosine
  lr_decay_samples: '584765624'
  lr_warmup_iters: '0'
  weight_decay: '0.1'
  clip_grad: '1.0'
  adam_beta1: '0.9'
  adam_beta2: '0.95'
  bf16: true
  fp8_recipe: mxfp8
  fp8_format: e4m3
  fp8_param_gather: true
  reuse_grad_buf_for_mxfp8_param_ag: true
  moe_router_padding_for_quantization: true
  init_method_std: '0.02'
  seed: '1234'
  eval_iters: '32'
  eval_interval: '1000'
  log_throughput: true
  log_interval: '1'
  log_timers_to_tensorboard: true
  log_memory_to_tensorboard: true
  log_memory_interval: '5'
  log_device_memory_used: true
  logging_level: '40'
  tensorboard_dir: ${MCORE_BENCH_OUTPUT}/tensorboard
  enable_experimental: true
  model_arch: qwen35_vl
  model_variant: 397b_a17b
  image_token_id: '248056'
  vision_num_layers: '27'
  hf_processor_path: Qwen/Qwen3.5-397B-A17B
  sft: true
  total_seq_length: '4096'
  thd_static_packing: true
  mdp_greedy_packing: true
  mdp_mock_dataset_config_json: ${MCORE_ROOT}/examples/multimodal_dev/doc/mdp/recipes/data/mock_fixed_4096.json
  mdp_enable: true
  mdp_overlap_window_capture: true
  encoder_recompute_granularity: whole
  mdp_encoder_max_payload_rows: '65536'
SLURM:
  nnodes: 32
  gpus_per_node: 4
  segment: 16
  time_limit: 0:40:00
